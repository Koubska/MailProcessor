# Tests and lint on every push and pull request. On a pushed tag, additionally builds the
# Windows, macOS (Apple Silicon) and Linux executables, attests their origin and publishes a GitHub release.
# Dependabot pull requests are built too and merged automatically when they are small and everything passed.
# Any pull request with the label "build" also builds the executables (no release), to test build changes.
# Dependencies come from uv.lock, so every build uses exactly the tested versions.
name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    # "labeled": adding the "build" label starts a test build of the executables.
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is the main target platform, so the tests run there too.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # only exact version tags exist for this action
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pytest -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # only exact version tags exist for this action
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check src tests scripts
      - name: Check the workflow files
        run: uvx --from actionlint-py actionlint

  build:
    name: Build
    # Dependabot PRs are built too, so an update that breaks the executables is never merged;
    # other PRs only with the label "build".
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      contains(github.event.pull_request.labels.*.name, 'build')
    needs: [test, lint]
    defaults:
      run:
        # The same shell on every runner; Windows would otherwise run PowerShell, which reads
        # bash syntax such as ${VERSION#v} differently.
        shell: bash
    permissions:
      contents: read
      id-token: write # sign the build provenance
      attestations: write # store it on GitHub
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest # Apple Silicon
            platform: macos
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # only exact version tags exist for this action
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --group build
      # Runs in every build (not only for tags), so a problem here shows up before a release.
      - name: Set the version (the tag, e.g. "3.5" or "v3.5"; a placeholder outside releases)
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '0.0.0.dev0' }}
        run: uv version "${VERSION#v}" --frozen
      - run: uv run --no-sync python scripts/build_executable.py --target-platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: mailprocessor-${{ matrix.platform }}
          path: dist/mailprocessor-${{ matrix.platform }}.zip
          if-no-files-found: error
      - name: Attest that the ZIP was built here (check with "gh attestation verify")
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/mailprocessor-${{ matrix.platform }}.zip

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its files
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create release with the three ZIP files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/mailprocessor-*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "mailprocessor $GITHUB_REF_NAME" \
            --notes "Downloads für Windows, macOS (Apple Silicon) und Linux: ZIP entpacken und das Programm doppelklicken." \
            --generate-notes

  dependabot-merge:
    name: Merge small Dependabot update
    # Runs only after tests, lint and all three builds passed for this pull request.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    needs: [test, lint, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # merge the pull request
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3
      # Patch and minor updates only (for a grouped PR, the largest change in it); major updates wait for a review.
      - if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --squash --delete-branch "$PR_URL"
