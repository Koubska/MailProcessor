# Tests on every push and pull request. On a pushed tag, additionally builds the
# Windows, macOS (Apple Silicon) and Linux executables and publishes a GitHub release.
name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is the main target platform, so the tests run there too.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: pytest -q

  build:
    name: Build
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest # Apple Silicon
            platform: macos
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pyinstaller
      - run: python scripts/build_executable.py --target-platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: mailprocessor-${{ matrix.platform }}
          path: dist/mailprocessor-${{ matrix.platform }}.zip
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its files
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create release with the three ZIP files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/mailprocessor-*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "mailprocessor $GITHUB_REF_NAME" \
            --notes "Downloads für Windows, macOS (Apple Silicon) und Linux: ZIP entpacken und das Programm doppelklicken."
