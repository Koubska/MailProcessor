[project]
name = "mailprocessor"
version = "3.0.0"
description = "Read-only mail processor with configurable body parsing and Excel export"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "openpyxl>=3.1.5",
  "pydantic>=2.9.2",
  "typer>=0.12.5",
]

[dependency-groups]
dev = ["pytest", "ruff"]
build = ["pyinstaller"]

[project.scripts]
mailprocessor = "mailprocessor.main:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mailprocessor = ["defaults/*.toml", "assets/icon.png"]


[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # typer.Option(...) as a default value is how typer declares options
