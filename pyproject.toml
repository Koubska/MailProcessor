[project]
name = "mailprocessor"
version = "2.1.0"
description = "Read-only mail processor with configurable body parsing and Excel export"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "openpyxl>=3.1.5",
  "pydantic>=2.9.2",
  "typer>=0.12.5",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
mailprocessor = "mailprocessor.main:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mailprocessor = ["defaults/*.toml"]

