# One [[fields]] entry per Excel column. Types:
#   label      text after a label on the same line, e.g. "Telefonnummer: 1234"
#   next_line  label alone on a line, the value on the next line
#   between    text between a start and an end text
#   email      an e-mail address (in the line with the label, or anywhere if no label)
#   regex      a hand-written regular expression in "pattern" (group 1 is the value)
# Labels ignore upper/lower case, extra spaces and a missing colon. Several labels: label = ["A", "B"].

[[fields]]
column = "Mail-Adresse"
# "Von:" line in the text, or the mail's own "From:" header.
type = "email"
label = ["Von", "From"]
required = true

[[fields]]
column = "Name"
type = "between"
start = "mein Kind"
end = "für folgendes Angebot"
required = true

[[fields]]
column = "Kurs"
type = "label"
label = "Angebot:"
required = true

[[fields]]
column = "Zeit"
type = "label"
label = "Tag:"
required = true

[[fields]]
column = "Telefonnummer"
type = "label"
label = "Telefonnummer:"
required = true
